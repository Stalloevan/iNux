[binaries]
c = ['/x/clang', '-arch', 'arm64', '-isysroot', '/sdk', '-miphoneos-version-min=17.0']
cpp = ['/x/clang++', '-arch', 'arm64', '-isysroot', '/sdk', '-miphoneos-version-min=17.0']
objc = ['/x/clang', '-arch', 'arm64', '-isysroot', '/sdk', '-miphoneos-version-min=17.0']
objcpp = ['/x/clang++', '-arch', 'arm64', '-isysroot', '/sdk', '-miphoneos-version-min=17.0']
ar = '/usr/bin/ar'
strip = '/usr/bin/strip'
# --static: every library is static, so links need the private
# dependencies pkg-config lists too.
pkg-config = ['/usr/bin/pkg-config', '--static']
cmake = '/usr/bin/cmake'
glib-compile-resources = '/usr/bin/glib-compile-resources'
glib-compile-schemas = '/usr/bin/glib-compile-schemas'
glib-genmarshal = '/usr/bin/glib-genmarshal'
glib-mkenums = '/usr/bin/glib-mkenums'
gdbus-codegen = '/usr/bin/gdbus-codegen'

[host_machine]
system = 'darwin'
subsystem = 'ios'
kernel = 'xnu'
cpu_family = 'aarch64'
cpu = 'arm64'
endian = 'little'

# For dependencies Meson looks up through CMake: search the iOS SDK and the
# prefix, not the macOS SDK.
[cmake]
CMAKE_SYSTEM_NAME = 'iOS'
CMAKE_OSX_SYSROOT = '/iosdk'
CMAKE_OSX_ARCHITECTURES = 'arm64'
CMAKE_FIND_ROOT_PATH = '/w/stage'
CMAKE_FIND_ROOT_PATH_MODE_LIBRARY = 'ONLY'
CMAKE_FIND_ROOT_PATH_MODE_INCLUDE = 'ONLY'
CMAKE_FIND_ROOT_PATH_MODE_PACKAGE = 'ONLY'

[properties]
needs_exe_wrapper = true
pkg_config_libdir = ['/w/stage/lib/pkgconfig', '/w/stage/share/pkgconfig']
# Answers GLib's configure checks would get by running test programs.
growing_stack = false
have_c99_vsnprintf = true
have_c99_snprintf = true
have_unix98_printf = true
va_val_copy = true
have_proc_self_cmdline = false

[built-in options]
c_args = ['-I/w/stage/include', '-w']
cpp_args = ['-I/w/stage/include', '-w']
objc_args = ['-I/w/stage/include', '-w']
objcpp_args = ['-I/w/stage/include', '-w']
c_link_args = ['-L/w/stage/lib', '-lc++', '-liconv', '-lresolv', '-Wl,-e,_gdk_uikit_entry', '-Wl,-u,_gdk_uikit_entry', '-framework', 'UIKit', '-framework', 'QuartzCore', '-framework', 'CoreGraphics', '-framework', 'CoreFoundation', '-framework', 'Foundation']
cpp_link_args = ['-L/w/stage/lib', '-lc++', '-liconv', '-lresolv', '-Wl,-e,_gdk_uikit_entry', '-Wl,-u,_gdk_uikit_entry', '-framework', 'UIKit', '-framework', 'QuartzCore', '-framework', 'CoreGraphics', '-framework', 'CoreFoundation', '-framework', 'Foundation']
objc_link_args = ['-L/w/stage/lib', '-lc++', '-liconv', '-lresolv', '-Wl,-e,_gdk_uikit_entry', '-Wl,-u,_gdk_uikit_entry', '-framework', 'UIKit', '-framework', 'QuartzCore', '-framework', 'CoreGraphics', '-framework', 'CoreFoundation', '-framework', 'Foundation']
objcpp_link_args = ['-L/w/stage/lib', '-lc++', '-liconv', '-lresolv', '-Wl,-e,_gdk_uikit_entry', '-Wl,-u,_gdk_uikit_entry', '-framework', 'UIKit', '-framework', 'QuartzCore', '-framework', 'CoreGraphics', '-framework', 'CoreFoundation', '-framework', 'Foundation']
vala_args = []
