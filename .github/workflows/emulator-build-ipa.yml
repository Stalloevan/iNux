name: Emulator IPA build (inactive)

# Reusable: turns a payload (Generated/ folder from Tools/port) into an
# unsigned IPA of the Template app with the iNux engine linked in.
on:
  workflow_call:
    inputs:
      payload_artifact:
        required: true
        type: string
      app_name:
        required: true
        type: string
      bundle_suffix:
        required: true
        type: string
      ipa_name:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      release_notes:
        required: false
        type: string
        default: "Unsigned IPA generated by iNux."
      replace_release:
        required: false
        type: boolean
        default: false
      delete_tag_after:
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.payload_artifact }}

      - name: Unpack payload
        run: |
          rm -rf Emulator/Template/Generated
          tar -C Emulator/Template -xzf payload.tgz
          cat Emulator/Template/Generated/manifest.json | head -c 2000

      - name: Cache engine
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: build/engine-ios
          key: engine-ios-v1-${{ hashFiles('Emulator/Engine/BLINK_COMMIT', 'Emulator/Engine/build-engine.sh', 'Emulator/Engine/shim/**') }}

      - name: Build engine for iOS
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: bash Tools/ci/run-logged.sh "iOS engine build" sh Emulator/Engine/build-engine.sh ios build/engine-ios

      - name: Install engine into template
        run: |
          mkdir -p Emulator/Template/Engine
          cp -R build/engine-ios/lib build/engine-ios/include Emulator/Template/Engine/
          ls -la Emulator/Template/Engine/lib

      - run: brew install xcodegen

      - name: Generate project
        working-directory: Emulator/Template
        env:
          DISPLAY_NAME: ${{ inputs.app_name }}
          BUNDLE_ID: com.inux.ported.${{ inputs.bundle_suffix }}
        run: xcodegen generate

      - name: Build
        working-directory: Emulator/Template
        run: >
          bash ../../Tools/ci/run-logged.sh "Xcode build"
          xcodebuild -project PortedApp.xcodeproj -scheme PortedApp -configuration Release
          -sdk iphoneos -derivedDataPath build
          -skipPackagePluginValidation -skipMacroValidation
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          build

      - name: Package IPA
        env:
          IPA_NAME: ${{ inputs.ipa_name }}
        run: |
          mkdir Payload
          cp -R Emulator/Template/build/Build/Products/Release-iphoneos/PortedApp.app Payload/
          zip -qry "$IPA_NAME" Payload
          ls -la "$IPA_NAME"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          TITLE: ${{ inputs.app_name }}
          NOTES: ${{ inputs.release_notes }}
          IPA_NAME: ${{ inputs.ipa_name }}
          REPLACE: ${{ inputs.replace_release }}
          DELETE_TAG: ${{ inputs.delete_tag_after }}
        run: |
          if [ "$REPLACE" = true ]; then
            gh release delete "$TAG" --cleanup-tag --yes || true
          fi
          gh release create "$TAG" "$IPA_NAME" --title "$TITLE" --notes "$NOTES" \
            --prerelease --target "${{ github.sha }}"
          if [ -n "$DELETE_TAG" ]; then
            gh release delete "$DELETE_TAG" --cleanup-tag --yes || true
          fi
