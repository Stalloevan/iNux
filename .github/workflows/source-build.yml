name: Source build

run-name: Build ${{ inputs.app_id || inputs.job_id }} from source (${{ inputs.job_id }})

# Resolves an app to its Flathub build plan, works out which KDE Frameworks
# it needs, cross-compiles those (plus host build tools, iNux compat
# libraries and third-party deps) and the app for iOS, and publishes an
# unsigned IPA. Finished modules are cached between runs, so a retry after
# a failure resumes at the module that failed.
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Job id from the iNux app
        required: true
      app_id:
        description: Flathub app id (e.g. org.kde.kbreakout), or blank to use an uploaded file
        required: false
      asset_name:
        description: Uploaded source file attached to release src-<job_id>, if no app_id
        required: false
      kf_version:
        description: KDE Frameworks version
        required: false
        default: "6.31.0"
      qt_series:
        description: Qt series for iOS (newest patch release is used)
        required: false
        default: "6.10"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python3 -m pip install --upgrade aqtinstall pyyaml
          brew install ninja meson pkg-config gettext
          echo "INUX_HOST_PREFIX_PATH=$(brew --prefix gettext)" >> "$GITHUB_ENV"

      - name: Install Qt (host + iOS)
        run: |
          QT=$(python3 -m aqt list-qt mac ios --spec "${{ inputs.qt_series }}" --latest-version)
          echo "Using Qt $QT"
          bash Tools/ci/run-logged.sh "aqt install" \
            python3 -m aqt install-qt mac ios "$QT" -O "$HOME/Qt" --autodesktop
          echo "QT_VERSION=$QT" >> "$GITHUB_ENV"
          echo "QT_IOS=$HOME/Qt/$QT/ios" >> "$GITHUB_ENV"
          echo "QT_HOST=$HOME/Qt/$QT/macos" >> "$GITHUB_ENV"
          ls "$HOME/Qt/$QT/ios/lib" | grep -E "Quick|Qml|Svg|Widgets|Xml|Test" | head -20 || true

      - name: Download uploaded source (if any)
        if: inputs.app_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work
          gh release download "src-${{ inputs.job_id }}" --pattern "${{ inputs.asset_name }}" --dir work

      - name: Resolve build plan
        run: |
          if [ -n "${{ inputs.app_id }}" ]; then
            python3 Tools/source/resolve.py --app-id "${{ inputs.app_id }}" --out plan
          else
            python3 Tools/source/resolve.py --file "work/${{ inputs.asset_name }}" --out plan
          fi
          TOOLKIT=$(python3 -c "import json;print(json.load(open('plan/plan.json'))['toolkit'])")
          APP=$(python3 -c "import json;d=json.load(open('plan/plan.json'));print(d.get('app_id') or '')")
          echo "TOOLKIT=$TOOLKIT" >> "$GITHUB_ENV"
          echo "APP_ID=$APP" >> "$GITHUB_ENV"
          if [ "$TOOLKIT" = "gtk" ]; then
            echo "::error title=Unsupported::GTK/GNOME apps are not supported yet (GTK has no iOS backend)."
            exit 1
          fi

      - name: Work out dependencies
        run: |
          python3 Tools/source/build.py --plan plan/plan.json --prefix stage --fetch-only --src-root src-plan
          python3 Tools/source/recipes/kf_graph.py --kf-version "${{ inputs.kf_version }}" \
            --cache kf-src --json graph.json src-plan/*
          python3 Tools/source/recipes/kde.py --graph graph.json --plan plan/plan.json \
            --kf-version "${{ inputs.kf_version }}" --recipe-out recipe.json --plan-out plan/plan-ios.json

      - name: Restore cached build stages
        uses: actions/cache/restore@v4
        with:
          path: |
            stage
            stage-host
          key: inux-stage-v1-qt${{ env.QT_VERSION }}-kf${{ inputs.kf_version }}-${{ github.run_id }}
          restore-keys: |
            inux-stage-v1-qt${{ env.QT_VERSION }}-kf${{ inputs.kf_version }}-

      - name: Cross-compile for iOS
        env:
          INUX_LOG_FILE: ${{ github.workspace }}/build-${{ inputs.job_id }}.log
        run: >
          bash Tools/ci/run-logged.sh "Source build"
          python3 Tools/source/build.py --plan plan/plan-ios.json --prefix stage --host-prefix stage-host
          --qt "$QT_IOS" --prepend recipe.json --jobs 3
          --bundle-id "com.inux.ported.j${{ inputs.job_id }}"
          --display-name "${APP_ID##*.}"

      - name: Upload build log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ci-logs >/dev/null 2>&1 || \
            gh release create ci-logs --prerelease --title "CI logs" --notes "Full logs of failed source builds."
          gzip -kf "build-${{ inputs.job_id }}.log"
          gh release upload ci-logs "build-${{ inputs.job_id }}.log.gz" --clobber

      - name: Save build stages
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            stage
            stage-host
          key: inux-stage-v1-qt${{ env.QT_VERSION }}-kf${{ inputs.kf_version }}-${{ github.run_id }}

      - name: Package IPA
        run: |
          ICON=""
          [ -f plan/files/icon.png ] && ICON="--icon plan/files/icon.png"
          SEARCH=$(cat stage/.inux-app-build-dir 2>/dev/null || echo src-build)
          python3 Tools/source/package_ipa.py --search "$SEARCH" \
            --out "Ported-${{ inputs.job_id }}.ipa" \
            --name "${APP_ID##*.}" \
            --bundle-id "com.inux.ported.j${{ inputs.job_id }}" \
            --share-dir stage/share --qml-dir stage/lib/qml $ICON

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-${{ inputs.job_id }}" "Ported-${{ inputs.job_id }}.ipa" \
            --title "${APP_ID:-${{ inputs.job_id }}}" --prerelease \
            --notes "Compiled from source for iOS by iNux. Unsigned; sign before installing." \
            --target "${{ github.sha }}"
          gh release delete "src-${{ inputs.job_id }}" --cleanup-tag --yes || true
