name: Port a Linux app

run-name: Port ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Job id created by the iNux app
        required: true
      app_name:
        description: Display name of the app
        required: true
      kind:
        description: appimage, flatpak or auto
        required: false
        default: auto
      asset_name:
        description: Name of the source file attached to release src-<job_id>
        required: true

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools flatpak ostree

      - name: Download source
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ inputs.job_id }}
          ASSET: ${{ inputs.asset_name }}
        run: |
          mkdir work
          gh release download "src-$JOB_ID" --pattern "$ASSET" --dir work

      - name: Extract payload
        env:
          ASSET: ${{ inputs.asset_name }}
          KIND: ${{ inputs.kind }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          python3 Tools/port/port.py --src "work/$ASSET" --kind "$KIND" --name "$APP_NAME" --out Template/Generated
          tar -C Template -czf payload.tgz Generated

      - uses: actions/upload-artifact@v4
        with:
          name: payload
          path: payload.tgz
          retention-days: 1

  build:
    needs: extract
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: payload

      - name: Unpack payload
        run: |
          rm -rf Template/Generated
          tar -C Template -xzf payload.tgz

      - run: brew install xcodegen

      - name: Generate project
        working-directory: Template
        env:
          DISPLAY_NAME: ${{ inputs.app_name }}
          BUNDLE_ID: com.inux.ported.${{ inputs.job_id }}
        run: xcodegen generate

      - name: Build
        working-directory: Template
        run: >
          xcodebuild -project PortedApp.xcodeproj -scheme PortedApp -configuration Release
          -sdk iphoneos -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          build

      - name: Package IPA
        env:
          APP_NAME: ${{ inputs.app_name }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          SAFE=$(printf '%s' "$APP_NAME" | tr -cs 'A-Za-z0-9' '_')
          mkdir Payload
          cp -R Template/build/Build/Products/Release-iphoneos/PortedApp.app Payload/
          zip -qry "${SAFE}-${JOB_ID}.ipa" Payload
          echo "IPA_FILE=${SAFE}-${JOB_ID}.ipa" >> "$GITHUB_ENV"

      - name: Publish and clean up
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ inputs.job_id }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          gh release create "app-$JOB_ID" "$IPA_FILE" --title "$APP_NAME ($JOB_ID)" \
            --notes "Unsigned IPA generated by iNux. See the payload report inside the app." --target "${{ github.sha }}"
          gh release delete "src-$JOB_ID" --cleanup-tag --yes
