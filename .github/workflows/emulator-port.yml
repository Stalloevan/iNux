name: Emulator port (inactive)

# Kept for later; the iNux app now uses source-build.yml.

run-name: Port ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Job id created by the iNux app
        required: true
      app_name:
        description: Display name of the app
        required: true
      kind:
        description: appimage, flatpak or auto
        required: false
        default: auto
      asset_name:
        description: Name of the source file attached to release src-<job_id>
        required: true

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q squashfs-tools flatpak ostree apt-file zlib1g-dev
          sudo apt-file update

      - name: Download source
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ inputs.job_id }}
          ASSET: ${{ inputs.asset_name }}
        run: |
          mkdir work
          gh release download "src-$JOB_ID" --pattern "$ASSET" --dir work

      - name: Extract and collect libraries
        env:
          ASSET: ${{ inputs.asset_name }}
          KIND: ${{ inputs.kind }}
          APP_NAME: ${{ inputs.app_name }}
        run: python3 Emulator/port/port.py --src "work/$ASSET" --kind "$KIND" --name "$APP_NAME" --out Generated

      - name: Cache engine
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: build/engine-host
          key: engine-host-v1-${{ runner.os }}-${{ hashFiles('Emulator/Engine/**') }}

      - name: Build engine for Linux
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: bash Tools/ci/run-logged.sh "Linux engine build" sh Emulator/Engine/build-engine.sh host build/engine-host

      - name: Smoke test under the engine
        run: python3 Emulator/port/smoke.py Generated build/engine-host/bin/inux-run --timeout 120

      - name: Pack payload
        run: tar -czf payload.tgz Generated

      - uses: actions/upload-artifact@v4
        with:
          name: payload
          path: payload.tgz
          retention-days: 1

  ipa:
    needs: extract
    uses: ./.github/workflows/emulator-build-ipa.yml
    with:
      payload_artifact: payload
      app_name: ${{ inputs.app_name }}
      bundle_suffix: j${{ inputs.job_id }}
      ipa_name: Ported-${{ inputs.job_id }}.ipa
      release_tag: app-${{ inputs.job_id }}
      release_notes: "Unsigned IPA generated by iNux. Sign it with your usual tool before installing."
      delete_tag_after: src-${{ inputs.job_id }}
