name: PortedApp
options:
  bundleIdPrefix: com.inux.ported
  deploymentTarget:
    iOS: "16.0"
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.13.0
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  PortedApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Generated
        type: folder
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: "${DISPLAY_NAME}"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "${BUNDLE_ID}"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging-Header.h
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Engine/include
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/Engine/lib
        OTHER_LDFLAGS: -linuxengine -lz
        TARGETED_DEVICE_FAMILY: "1,2"
