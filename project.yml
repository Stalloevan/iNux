name: iNux
options:
  bundleIdPrefix: com.inux
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  iNux:
    type: application
    platform: iOS
    sources:
      - path: iNux
    info:
      path: Support/iNux-Info.plist
      properties:
        CFBundleDisplayName: iNux
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inux.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
